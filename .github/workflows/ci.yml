name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build site from existing data
        run: python -m scripts.build_site

      - name: Check that the build produced a page
        run: |
          test -s docs/index.html
          grep -q "贵金属信号灯" docs/index.html
          echo "构建产物正常"
