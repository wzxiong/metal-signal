name: Daily Metal Signal

on:
  schedule:
    # 北京时间 09:30（中国不使用夏令时，UTC+8 固定）
    - cron: '30 1 * * *'
  # 代码/配置有改动时也跑一次，保证上线内容与代码一致。
  # 机器人自己提交的数据快照用 GITHUB_TOKEN 推送，不会再次触发本工作流。
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      backfill:
        description: '强制回填最近两年历史'
        type: boolean
        default: false

permissions:
  contents: write      # 需要把 data/ 与 docs/ 提交回仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      # 先抓当日行情（关键路径，趁着请求配额还没被消耗）
      - name: Fetch latest quotes
        id: fetch
        continue-on-error: true
        run: python -m scripts.fetch_data

      # 再补历史日线；历史充足时这一步直接跳过、不发请求
      - name: Backfill history
        continue-on-error: true
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python -m scripts.backfill --force
          else
            python -m scripts.backfill
          fi

      # 即使行情降级也照常构建，让页面显示的"数据已滞后"第一时间可见
      - name: Build static site
        run: python -m scripts.build_site

      - name: Flag degraded data
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::行情抓取失败，本次为降级发布（页面会显示数据滞后提示）"
          {
            echo "### ⚠️ 本次抓取失败"
            echo ""
            echo "已使用历史缓存降级发布，详见上方日志。常见原因：Yahoo 对云端 IP 限流（HTTP 429）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data back
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "数据没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 更新 $(date -u '+%Y-%m-%d') 行情快照"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            echo "第 ${attempt} 次推送失败，5 秒后重试"
            sleep 5
          done
          echo "推送失败" >&2
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
